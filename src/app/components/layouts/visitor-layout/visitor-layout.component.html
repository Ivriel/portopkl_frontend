<div class="relative max-w-full min-h-screen overflow-hidden">
  
    <!-- Animated Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#121212] via-[#1a1a1a] to-[#0a0a0a]">
      <!-- Grid Pattern Overlay -->
  <div class="absolute inset-0 opacity-20" style="background-image: url(&quot;data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='80' height='80' fill='none' stroke='%23ffffff' stroke-width='1' stroke-opacity='0.25'/%3E%3C/svg%3E&quot;);"></div>
    </div>
  
    <!-- Page Content -->
    <div class="relative z-10">
      <app-hero></app-hero>
      <app-introduction></app-introduction>
      <app-about></app-about>
      <app-timeline-project></app-timeline-project>
      <app-list-portfolio></app-list-portfolio>
      <app-gallery></app-gallery>
      <button title="Scroll to top" (click)="scrollToTop()"
        class="bg-[#34D399] fixed cursor-pointer rounded-lg h-[50px] flex items-center p-4 w-fit z-50 m-2 right-0 bottom-0 transition-all duration-300 ease-out"
        [class.opacity-100]="showButton" [class.scale-100]="showButton" [class.translate-y-0]="showButton"
        [class.opacity-0]="!showButton" [class.scale-95]="!showButton" [class.translate-y-3]="!showButton" 
        [class.rotate-x-3]="!showButton"
        [class.pointer-events-none]="!showButton" [class.select-none]="!showButton">
        <i class="pi pi-arrow-up"></i>
      </button>
      <app-footer></app-footer>
    </div>
  </div>
