<!-- Background Setting Display - Admin View -->
<section class="min-h-screen w-full px-4 sm:px-6 lg:px-8 py-8">
  <div class="max-w-5xl mx-auto w-full">

    <!-- Header Section -->
    <div class="mb-6 pb-4 border-b border-zinc-700">
      <div class="flex items-center gap-2 mb-4">
        <i class="pi pi-cog text-lg sm:text-xl text-white"></i>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-white">
            Setting Background Display
          </h1>
          <p class="text-gray-400 text-xs sm:text-sm mt-0.5">Manage and view all your settings</p>
        </div>
      </div>
      <button (click)="onEditSetting()"
        class="w-full sm:w-auto px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg border border-zinc-700 transition-all duration-200 flex items-center justify-center gap-2 font-medium text-sm">
        <i class="pi pi-pencil"></i>
        Edit Setting
      </button>
    </div>

    <!-- Main Content Card -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 sm:p-6 space-y-6">

      <!-- Background Images Section -->
      <div>
        <h2 class="text-base sm:text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <i class="pi pi-image text-sm sm:text-base"></i>
          Background Images
        </h2>

        <!-- Background Image -->
        <div class="bg-zinc-800/50 rounded-lg border border-zinc-700 overflow-hidden">
          <div class="px-3 sm:px-4 py-2.5 sm:py-3 border-b border-zinc-700">
            <div class="flex items-center justify-between">
              <h3 class="text-xs sm:text-sm font-medium text-gray-300">Background Image</h3>
              <span class="text-xs text-gray-500 bg-zinc-800 px-2 py-1 rounded">Image</span>
            </div>
          </div>
          <div class="p-3 sm:p-4">
            <div class="relative w-full h-40 sm:h-48 bg-zinc-800 rounded-lg overflow-hidden">
              <img [src]="setting.backgroundImageVisitor" alt="Background Image"
                class="w-full h-full object-cover">
            </div>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="border-t border-zinc-800"></div>

      <!-- Background Colors Section -->
      <div>
        <h2 class="text-base sm:text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <i class="pi pi-palette text-sm sm:text-base"></i>
          Background Colors
        </h2>

        <!-- Background Color -->
        <div class="bg-zinc-800/50 rounded-lg border border-zinc-700 overflow-hidden">
          <div class="px-3 sm:px-4 py-2.5 sm:py-3 border-b border-zinc-700">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
              <h3 class="text-xs sm:text-sm font-medium text-gray-300">Background Color</h3>
              <span class="text-xs text-gray-400 bg-zinc-800 px-2 py-1 rounded font-mono w-fit">
                {{ setting.backgroundColorVisitor }}
              </span>
            </div>
          </div>
          <div class="p-3 sm:p-4">
            <div class="w-full h-40 sm:h-48 rounded-lg border-2 border-zinc-700"
              [style.background-color]="setting.backgroundColorVisitor">
            </div>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="border-t border-zinc-800"></div>

      <!-- Background SVG Section -->
      <div>
        <h2 class="text-base sm:text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <i class="pi pi-code text-sm sm:text-base"></i>
          Background SVG Patterns
        </h2>

        <!-- Background SVG -->
        <div class="bg-zinc-800/50 rounded-lg border border-zinc-700 overflow-hidden">
          <div class="px-3 sm:px-4 py-2.5 sm:py-3 border-b border-zinc-700">
            <div class="flex items-center justify-between">
              <h3 class="text-xs sm:text-sm font-medium text-gray-300">SVG Pattern</h3>
              <span class="text-xs text-gray-500 bg-zinc-800 px-2 py-1 rounded">SVG</span>
            </div>
          </div>
          <div class="p-3 sm:p-4">
            <div class="w-full h-40 sm:h-48 rounded-lg border-2 border-zinc-700" [ngStyle]="visitorSvgStyle">
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>
