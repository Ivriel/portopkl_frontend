<!-- about.component.html - Admin Setting Display -->
<section class="min-h-screen w-full px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-5xl mx-auto w-full">
      
      <!-- Header Section -->
      <div class="mb-6 sm:mb-8 pb-4 border-b border-zinc-700">
        <div class="flex items-center gap-2 mb-4">
          <i class="pi pi-cog text-lg sm:text-xl text-white"></i>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-white">
              Setting About Me Display
            </h1>
            <p class="text-gray-400 text-xs sm:text-sm mt-0.5">Manage and view all your settings</p>
          </div>
        </div>
        <button 
          (click)="onEditSettingAboutMe()" 
          class="w-full sm:w-auto px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg border border-zinc-700 transition-all duration-200 flex items-center justify-center gap-2 font-medium text-sm">
          <i class="pi pi-pencil"></i>
          Edit Setting
        </button>
      </div>
  
      <!-- Main Content Card -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 space-y-6">
        
      <!-- Profile Section -->
<div class="flex flex-col md:flex-row md:items-start md:gap-8">
  
  <!-- Profile Image -->
  <div class="flex-shrink-0">
    <label class="block text-sm font-medium text-gray-400 mb-2">Profile Image</label>
    <div class="relative w-[200px] aspect-square">
      <img 
        [src]="settingAboutMeData.imageAboutMe"
        alt="Profile" 
        class="w-full h-full object-cover rounded-lg border-2 border-zinc-700">
    </div>
  </div>

  <!-- Basic Info -->
  <div class="flex-1 mt-6 md:mt-0 space-y-4">
    
    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-400 mb-2">Full Name</label>
      <div class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3">
        <p class="text-white font-medium">{{ settingAboutMeData.nama }}</p>
      </div>
    </div>

    <!-- Class -->
    <div>
      <label class="block text-sm font-medium text-gray-400 mb-2">Class</label>
      <div class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3">
        <p class="text-white">{{ settingAboutMeData.kelas }}</p>
      </div>
    </div>

  </div>
</div>

  
        <!-- Divider -->
        <div class="border-t border-zinc-800"></div>
  
        <!-- Description Section -->
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-2">About Description</label>
          <div class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3">
            <p class="text-gray-300 leading-relaxed mb-3">
              {{settingAboutMeData.description}}
            </p>
          </div>
        </div>
  
        <!-- Divider -->
        <div class="border-t border-zinc-800"></div>
  
        <!-- Social Links Section -->
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-3">Contact & Social Media</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            
            <!-- Contacts -->
             @for (contact of settingAboutMeData.contacts; track $index) {
            <div class="bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 flex items-center gap-3">
              <i class="{{contact.icon}} text-white text-lg"></i>
              <div class="flex-1 min-w-0">
                <p class="text-xs text-gray-400">{{contact.icon}}</p>
                <a href="{{contact.link}}" target="_blank" 
                  class="text-sm text-[#34D399] hover:underline truncate block">
                  {{contact.link}}
                </a>
              </div>
            </div>
            }
  
        
          </div>
        </div>
  
      </div>
  
    </div>
  </section>
