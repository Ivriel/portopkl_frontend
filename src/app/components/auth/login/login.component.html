<form (ngSubmit)="onLogin()">
  <div>
    <label class="text-red-500">Email</label><br>
    <input type="email"
           [(ngModel)]="loginObj.email"
           name="email"
           required />
  </div>

  <div>
    <label>Password</label><br>
    <input type="password"
           [(ngModel)]="loginObj.password"
           name="password"
           required />
  </div>

  <button type="submit">Login</button>
</form>
