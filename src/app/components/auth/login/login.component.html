<div class="min-h-screen bg-[#09090B] flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Animated Background Orbs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Large glowing orb -->
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-[#6EE7B7]/30 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-[#6EE7B7]/25 rounded-full blur-3xl animate-pulse-slow-delayed"></div>
    
    <!-- Medium orbs -->
    <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-[#6EE7B7]/20 rounded-full blur-2xl animate-float-gentle"></div>
    <div class="absolute bottom-1/4 right-1/4 w-24 h-24 bg-[#6EE7B7]/25 rounded-full blur-2xl animate-float-gentle-delayed"></div>
    
    <!-- Additional smaller orbs for more movement -->
    <div class="absolute top-1/2 left-1/6 w-16 h-16 bg-[#6EE7B7]/15 rounded-full blur-xl animate-float-gentle"></div>
    <div class="absolute bottom-1/3 left-1/2 w-20 h-20 bg-[#6EE7B7]/18 rounded-full blur-xl animate-pulse-slow"></div>
  </div>


  <div class="bg-[#18181B] border border-[#6EE7B7] rounded-xl shadow-lg w-full max-w-md p-8 relative z-10">

    <div class="text-center mb-8">
      <h2 class="text-2xl font-semibold text-white mb-2">Welcome Back</h2>
      <p class="text-gray-400 text-sm">Please sign in to your account</p>
    </div>

 
    <form (ngSubmit)="onLogin()" class="space-y-5">

      <div class="space-y-2">
        <p-floatlabel class="block" variant="on">
          <input 
            pInputText 
            id="email_field" 
            name="email" 
            class="w-full h-11 px-3 py-2 bg-[#0f172a] border border-[#334155] 
                   rounded-md focus:border-[#475569] focus:ring-1 focus:ring-[#475569] 
                   text-white placeholder-gray-500 text-sm transition-colors duration-200" 
            [(ngModel)]="loginObj.email" 
            autocomplete="email"
            required
          />
          <label for="email_field" class="text-gray-400 text-sm">Email Address</label>
        </p-floatlabel>
      </div>


      <div class="space-y-2">
        <p-floatlabel class="block" variant="on">
          <p-password
            id="password_field"
            name="password"
            [(ngModel)]="loginObj.password"
            [feedback]="false" 
            toggleMask="true"
            autocomplete="current-password"
            styleClass="w-full" 
            inputStyleClass="w-full h-11 px-3 py-2 bg-[#0f172a] border border-[#334155] 
                            rounded-md focus:border-[#475569] focus:ring-1 
                            focus:ring-[#475569] text-white placeholder-gray-500 text-sm 
                            transition-colors duration-200"
          ></p-password>
          <label for="password_field" class="text-gray-400 text-sm">Password</label>
        </p-floatlabel>
      </div>


      <div class="pt-2">
        <p-button 
          label="Sign In" 
          type="submit"
          styleClass="w-full h-10 bg-[#334155] hover:bg-[#475569] border-none 
                      text-white font-medium rounded-md transition-colors duration-200 
                      flex items-center justify-center text-sm"
        />
      </div>
    </form>


    <div class="mt-6 text-center">
      <p class="text-gray-400 text-sm">
        Don't have an account? 
        <a href="#" class="text-[#34D399] hover:text-white font-medium transition-colors duration-200 hover:underline">
          Sign up here
        </a>
      </p>
    </div>
  </div>

</div>
