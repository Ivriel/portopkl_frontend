<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Subtle Background Pattern -->
  <div class="absolute inset-0 opacity-[0.03]" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%2334D399\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>

  <div class="bg-[#18181B] border border-[#34D399] rounded-xl shadow-lg w-full max-w-md p-8 relative z-10">

    <div class="text-center mb-8">
      <h2 class="text-2xl font-semibold text-white mb-2">Welcome</h2>
      <p class="text-gray-400 text-sm">Please register your account first</p>
    </div>

    <form (ngSubmit)="onRegister()" class="space-y-5" #registerForm="ngForm">
      <div>
        <p-floatlabel class="block" variant="in">
          <input 
            pInputText 
            id="nama_field" 
            name="nama" 
            #namaInput="ngModel"
            class="w-full h-11 px-3 py-2 bg-[#0f172a] border border-[#334155] 
                   rounded-md focus:border-[#34D399] focus:ring-1 focus:ring-[#34D399] 
                   text-white placeholder-gray-500 text-sm transition-colors duration-200" 
            [(ngModel)]="registerObj.nama" 
            autocomplete="name"
            required
          />
          <label for="nama_field" class="text-gray-400 text-sm">Nama</label>
        </p-floatlabel>
        <span *ngIf="namaInput.errors?.['required'] && namaInput.touched" class="text-red-500 text-[14px]">Nama harus diisi</span>
      </div>

      <div>
        <p-floatlabel class="block" variant="in">
          <input 
            pInputText 
            id="email_field" 
            name="email" 
            #emailInput="ngModel"
            type="email"
            class="w-full h-11 px-3 py-2 bg-[#0f172a] border border-[#334155] 
                   rounded-md focus:border-[#34D399] focus:ring-1 focus:ring-[#34D399] 
                   text-white placeholder-gray-500 text-sm transition-colors duration-200" 
            [(ngModel)]="registerObj.email" 
            autocomplete="email"
            required
            email
          />
          <label for="email_field" class="text-gray-400 text-sm">Email Address</label>
        </p-floatlabel>
        <span *ngIf="emailInput.errors?.['required'] && emailInput.touched" class="text-red-500 text-[14px]">Email harus diisi</span>
        <span *ngIf="emailInput.errors?.['email'] && emailInput.touched" class="text-red-500 text-[14px]">Format email tidak valid</span>
      </div>

      <div>
        <p-floatlabel class="block" variant="in">
          <p-password
            id="password_field"
            name="password"
            #passwordInput="ngModel"
            [(ngModel)]="registerObj.password"
            [feedback]="false" 
            toggleMask="true"
            autocomplete="current-password"
            styleClass="w-full" 
            inputStyleClass="w-full h-11 px-3 py-2 bg-[#0f172a] border border-[#334155] 
                            rounded-md focus:border-[#34D399] focus:ring-1 
                            focus:ring-[#34D399] text-white placeholder-gray-500 text-sm 
                            transition-colors duration-200"
            required
            minlength="6"
          ></p-password>
          <label for="password_field" class="text-gray-400 text-sm">Password</label>
        </p-floatlabel>
        <span *ngIf="passwordInput.errors?.['required'] && passwordInput.touched" class="text-red-500 text-[14px]">Password harus diisi</span>
        <span *ngIf="passwordInput.errors?.['minlength'] && passwordInput.touched" class="text-red-500 text-[14px]">Password minimal 6 karakter</span>
      </div>

      <div class="pt-2">
        <button 
          type="submit"
          [class]="registerForm.invalid ? 'w-full bg-[#18684b]  h-10 border-none  text-white font-medium rounded-md transition-colors duration-200 flex items-center justify-center text-sm cursor-not-allowed' : 'w-full bg-[#34D399]  h-10 border-none  text-white font-medium rounded-md transition-colors duration-200 flex items-center justify-center text-sm cursor-pointer' "
          [disabled]="registerForm.invalid"
          [title]="registerForm.invalid ? 'Form tidak valid' : 'Daftar'"
        >Register</button>
      </div>
    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-400 text-sm">
        Already have an account?
        <a routerLink="/admin/login" class="text-[#34D399] hover:text-white font-medium transition-colors duration-200 hover:underline">
          Log in here
        </a>
      </p>
    </div>

  </div>
</div>
