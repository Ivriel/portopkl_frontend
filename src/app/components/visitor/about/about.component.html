<!-- about.component.html -->
<section id="about" class="min-h-screen w-full px-4 sm:px-6 lg:px-8 py-20 flex items-center">
  <div class="max-w-6xl mx-auto w-full">

    <!-- Section Title - Centered -->
    <div class="text-center mb-16">
      <h1 class="text-4xl sm:text-5xl font-bold text-white mb-3">
        About <span class="text-[#34D399]">Me</span>
      </h1>
      <div class="w-20 h-1 bg-[#34D399] mx-auto mb-4"></div>
      <p class="text-gray-400 text-center mb-16 text-lg">Profil singkat dan kontak saya</p>
    </div>

    <!-- Main Card Container -->
    <div
      class="bg-zinc-900/40 backdrop-blur-sm border border-zinc-800 rounded-3xl p-8 sm:p-12 hover:border-[#34D399]/50 transition-all duration-300">

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">

        <!-- Left: Profile Image Circle (4 cols) -->
        <div class="lg:col-span-4 flex justify-center">
          <div class="relative">
            <!-- Circle Border with Gradient -->
            <div class="absolute inset-0 bg-gradient-to-br from-[#34D399] to-[#059669] rounded-full p-1">
              <div class="w-full h-full bg-zinc-900 rounded-full"></div>
            </div>
            <!-- Image -->
            <div
              class="relative rounded-full overflow-hidden w-64 h-64 sm:w-80 sm:h-80 border-4 border-transparent bg-gradient-to-br from-[#34D399] to-[#059669] p-1">
              <img [src]="settingAboutMe.imageAboutMe" alt="Ivriel Dei Gratia Gunawan"
                class="w-full h-full object-cover rounded-full">
            </div>
          </div>
        </div>

        <!-- Right: Info Section (8 cols) -->
        <div class="lg:col-span-8 space-y-6">

          <!-- Info Box 1: Name & Class -->
          <div
            class="bg-zinc-800/50 rounded-2xl p-6 hover:bg-zinc-800/80 hover:border-[#34D399]/30 border border-zinc-700/50 transition-all duration-300 group">
            <h2 class="text-2xl sm:text-3xl font-bold text-white mb-2 group-hover:text-[#34D399] transition-colors">
              {{settingAboutMe.nama}}
            </h2>
            <p class="text-[#34D399] text-lg font-medium">
              Kelas: {{settingAboutMe.kelas}}
            </p>
          </div>

          <!-- Info Box 2: Description -->
          <div
            class="bg-zinc-800/50 rounded-2xl p-6 hover:bg-zinc-800/80 hover:border-[#34D399]/30 border border-zinc-700/50 transition-all duration-300">
            <p class="text-gray-300 leading-relaxed mb-4">
              {{settingAboutMe.description}}
            </p>
          </div>

          <!-- Info Box 3: CTA & Social -->
          <div
            class="group bg-zinc-800/50 rounded-2xl p-6 space-y-4 hover:bg-zinc-800/80 hover:border-[#34D399]/30 border border-zinc-700/50 transition-all duration-300">
            <h2 class=" text-[20px] font-bold text-white mb-2 group-hover:text-[#34D399] transition-colors">
              Contact me at:
            </h2>
            <div class="flex items-center gap-6">
              <!-- Social Links -->
              <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
                @for (contact of settingAboutMe.contacts; track $index) {
                  <a [href]="contact.link" class="social-icon" target="_blank" aria-label="GitHub">
                    <i class="{{contact.icon}} text-lg"></i>
                  </a>
                }
            
              </div>

            </div>
          </div>

        </div>

      </div>

    </div>

  </div>
</section>
