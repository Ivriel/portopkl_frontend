<div *ngIf="listPortfolio && listPortfolio.length > 0" class="flex flex-col items-center relative min-h-screen pb-5">
  <!-- Animated Background Orbs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-[#6EE7B7]/30 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-[#6EE7B7]/25 rounded-full blur-3xl animate-pulse-slow-delayed"></div>
    <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-[#6EE7B7]/20 rounded-full blur-2xl animate-float-gentle"></div>
    <div class="absolute bottom-1/4 right-1/4 w-24 h-24 bg-[#6EE7B7]/25 rounded-full blur-2xl animate-float-gentle-delayed"></div>
    <div class="absolute top-1/2 left-1/6 w-16 h-16 bg-[#6EE7B7]/15 rounded-full blur-xl animate-float-gentle"></div>
    <div class="absolute bottom-1/3 left-1/2 w-20 h-20 bg-[#6EE7B7]/18 rounded-full blur-xl animate-pulse-slow"></div>
  </div>

  <h2 class="text-white mb-6 text-xl font-semibold relative z-10">Portfolio List</h2>

  <div class="flex flex-wrap justify-center gap-6 w-full relative z-10">
    <div *ngFor="let portfolio of listPortfolio" class="w-full sm:w-1/2 lg:w-1/3 flex justify-center">
      
      <!-- Card -->
      <p-card 
        styleClass="relative z-10 h-full w-[320px] border border-gray-700 rounded-xl shadow-lg bg-gray-900/90 backdrop-blur-md">
        
        <!-- Custom Header -->
        <ng-template pTemplate="header">
          <div class="relative">
            <!-- Thumbnail -->
            <img *ngIf="portfolio.thumbnail" [src]="portfolio.thumbnail" [alt]="portfolio.title" 
                 class="w-full h-[200px] object-cover rounded-t-lg">
            
            <!-- Type Project (pojok kanan atas gambar, tanpa bg overlay hitam) -->
            <span class="absolute top-2 right-2 px-2 py-0.5 rounded-md text-xs font-medium"
                  [ngClass]="{
                    'bg-emerald-500 text-white': portfolio.typeProject === 'industry',
                    'bg-blue-500 text-white': portfolio.typeProject === 'personal'
                  }">
              {{ portfolio.typeProject }}
            </span>
          </div>
        </ng-template>

        <!-- Body -->
        <div class="flex justify-between items-center mb-3 mt-2">
          <!-- Title -->
          <span class="font-semibold text-white">{{ portfolio.title }}</span>
          
          <!-- Category + Status -->
          <div>
            <p-tag [value]="portfolio.category" severity="info"></p-tag>
            <p-tag [value]="portfolio.status" severity="success" styleClass="ml-2"></p-tag>
          </div>
        </div>

        <!-- Footer -->
        <ng-template pTemplate="footer">
          <p-button label="View Details" icon="pi pi-eye" 
                    [routerLink]="['/portfolio', portfolio._id]" 
                    styleClass="w-full"></p-button>
        </ng-template>
      </p-card>
    </div>
  </div>
</div>

<div *ngIf="!listPortfolio || listPortfolio.length === 0" class="flex justify-center mt-10 text-gray-400">
  <p>No portfolios found or loading...</p>
</div>
