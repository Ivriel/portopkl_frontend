<div class="min-h-screen p-4 sm:p-6">
  
  <!-- Header -->
  <div class="max-w-7xl mx-auto mb-12">
    <div class="text-center">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-3">Portfolio</h1>
      <p class="text-gray-400 text-lg">Koleksi proyek-proyek yang telah saya kerjakan</p>
    </div>
  </div>

  <!-- Portfolio Grid -->
  <div class="max-w-7xl mx-auto">
    
    <!-- Skeleton Loading State -->
    <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let item of [1,2,3,4,5,6]" 
           class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-hidden">
        
        <!-- Thumbnail Skeleton -->
        <div class="h-48 bg-zinc-800">
          <p-skeleton width="100%" height="100%"></p-skeleton>
        </div>

        <!-- Content Skeleton -->
        <div class="p-5">
          <!-- Title Skeleton -->
          <p-skeleton width="80%" height="1.5rem" styleClass="mb-3"></p-skeleton>

          <!-- Info Skeleton -->
          <div class="flex gap-2 mb-4">
            <p-skeleton width="5rem" height="1.75rem" borderRadius="6px"></p-skeleton>
            <p-skeleton width="4rem" height="1.75rem" borderRadius="6px"></p-skeleton>
          </div>

          <!-- Button Skeleton -->
          <p-skeleton width="100%" height="2.5rem" borderRadius="8px"></p-skeleton>
        </div>
      </div>
    </div>

    <!-- Portfolio Cards -->
    <div *ngIf="!isLoading && listPortfolio && listPortfolio.length > 0" 
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <div *ngFor="let portfolio of listPortfolio" 
           class="group bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden hover:border-[#34D399]/50 transition-all duration-300 cursor-pointer">
        
        <!-- Thumbnail -->
        <div class="relative overflow-hidden h-48 bg-zinc-800">
          <img *ngIf="portfolio.thumbnail" 
               [src]="portfolio.thumbnail" 
               [alt]="portfolio.title"
               class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          
          <!-- Type Badge -->
          <div class="absolute top-3 right-3">
            <span [ngClass]="{
              'bg-emerald-500 text-white': portfolio.typeProject === 'industry',
              'bg-blue-500 text-white': portfolio.typeProject === 'personal'
            }" class="px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm">
              {{ portfolio.typeProject | titlecase }}
            </span>
          </div>
        </div>

        <!-- Content -->
        <div class="p-5">
          <!-- Title -->
          <h3 class="text-lg font-bold text-white mb-3 line-clamp-2 group-hover:text-[#34D399] transition-colors">
            {{ portfolio.title }}
          </h3>

          <!-- Meta Info -->
          <div class="flex flex-wrap gap-2 mb-4">
            <!-- Category -->
            <span class="px-2.5 py-1 bg-zinc-800 text-gray-300 rounded-md text-xs font-medium flex items-center gap-1">
              <i class="pi pi-tag text-[10px]"></i>
              {{ portfolio.category | titlecase }}
            </span>
            
            <!-- Status -->
            <span [ngClass]="{
              'bg-[#34D399]/20 text-[#34D399]': portfolio.status === 'finished',
              'bg-blue-500/20 text-blue-400': portfolio.status === 'on progress'
            }" class="px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1">
              <i class="pi text-[10px]" [ngClass]="{
                'pi-check-circle': portfolio.status === 'finished',
                'pi-clock': portfolio.status === 'on progress'
              }"></i>
              {{ portfolio.status | titlecase }}
            </span>
          </div>

          <!-- View Button -->
          <button [routerLink]="['/portfolio', portfolio._id]"
                  class="w-full px-4 py-2.5 bg-[#34D399]/10 hover:bg-[#34D399]/20 text-[#34D399] border border-[#34D399]/30 rounded-lg text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2">
            <i class="pi pi-arrow-right text-xs"></i>
            View Details
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && (!listPortfolio || listPortfolio.length === 0)" 
         class="text-center py-20">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-zinc-900 border border-zinc-800 mb-6">
        <i class="pi pi-inbox text-5xl text-gray-600"></i>
      </div>
      <h3 class="text-xl font-semibold text-white mb-2">No Portfolios Yet</h3>
      <p class="text-gray-400">Kompetensi saya akan ditampilkan di sini segera</p>
    </div>

  </div>
</div>
