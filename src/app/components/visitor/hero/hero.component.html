<!-- hero.component.html -->
<section class="flex items-center justify-center min-h-screen px-4">
  <div class="text-center max-w-4xl">
    
    <!-- Typewriter Heading -->
    <h1 class="text-5xl md:text-7xl lg:text-8xl font-bold mb-6 animate-fade-in">
      <om-typewriter
        [words]="words"
        [writeSpeed]="100"
        [deleteDelay]="1500"
        [writeDelay]="100"
        textCursorColor="#34D399"
        class="typewriter-text"
      ></om-typewriter>
    </h1>

    <!-- Subtitle with Gradient -->
    <p class="text-lg md:text-xl text-gray-400 mb-4 animate-fade-in-up animation-delay-500">
      <span class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-[#34D399] to-[#059669]">
        IVRIEL DEI GRATIA GUNAWAN
      </span>
    </p>
    <p class="text-sm md:text-base text-gray-500 mb-2 animate-fade-in-up animation-delay-700">
      Frontend - Mobile Developer
    </p>
    <p class="text-sm md:text-base text-gray-500 mb-5 animate-fade-in-up animation-delay-700">
      XII RPL A / 14
    </p>

    <!-- Animated Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-2 bg-zinc-900/50 backdrop-blur-sm border border-[#34D399]/20 rounded-full mb-8 animate-fade-in-down">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#34D399] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#34D399]"></span>
      </span>
      <span class="text-xs font-medium text-gray-300">Praktik Kerja Lapangan</span>
    </div>

    <p-divider align="center" type="solid" class="co">
      <b class="text-emerald-500">Mulai Jelajah</b>
    </p-divider>

    <!-- Tombol tombol navigasi section -->
    <div class="flex items-center justify-center gap-4">
      <a [routerLink]="['/']" fragment="introduction" class="hover:text-emerald-400">
        Introduction
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="about" class="hover:text-emerald-400">
        About
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="timeline" class="hover:text-emerald-400">
        Timeline
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="list-project" class="hover:text-emerald-400">
        List Projects
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="gallery" class="hover:text-emerald-400">
        Gallery
      </a>
    </div>

  </div>
</section>
