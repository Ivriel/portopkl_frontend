<section class="flex items-center justify-center min-h-screen px-4 sm:px-6">
  <div class="text-center max-w-4xl w-full">
    
    <!-- Typewriter Heading -->
    <h1 class="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-bold mb-6 animate-fade-in">
      <om-word-rotation
        [words]="words"
        [wordDelay]=1500
        animationSpeed=100
        [reverseAnimation]=true
        textCursorColor="#34D399"
        styleClass="word-rotation-text"
      ></om-word-rotation>
    </h1>

    <!-- Subtitle with Gradient -->
    <p class="text-base sm:text-lg md:text-xl text-gray-400 mb-4 animate-fade-in-up animation-delay-500">
      <span class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-[#34D399] to-[#059669]">
        IVRIEL DEI GRATIA GUNAWAN
      </span>
    </p>
    <p class="text-xs sm:text-sm md:text-base text-gray-500 mb-2 animate-fade-in-up animation-delay-700">
      Frontend - Mobile Developer
    </p>
    <p class="text-xs sm:text-sm md:text-base text-gray-500 mb-5 animate-fade-in-up animation-delay-700">
      XII RPL A / 14
    </p>

    <!-- Animated Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-2 bg-zinc-900/50 backdrop-blur-sm border border-[#34D399]/20 rounded-full mb-8 animate-fade-in-down">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#34D399] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#34D399]"></span>
      </span>
      <span class="text-xs sm:text-sm font-medium text-gray-300">Praktik Kerja Lapangan</span>
    </div>

    <p-divider align="center" type="solid">
      <b class="text-emerald-500 text-base sm:text-lg">Mulai Jelajah</b>
    </p-divider>

    <!-- Tombol tombol navigasi section -->
    <div 
      [ngClass]="{
        'fixed top-1 left-1/2 -translate-x-1/2 z-50 translate-y-0 opacity-100 bg-black border border-emerald-500 rounded-full px-6 py-3 backdrop-blur-md shadow-lg shadow-emerald-500/20': isScrolled,
        'relative translate-y-4 opacity-0': !isScrolled && false,
        'relative': !isScrolled
      }"
      class="flex flex-wrap items-center justify-center gap-3 sm:gap-4 text-sm sm:text-base mt-6 transition-all duration-500 ease-in-out">
      <a [routerLink]="['/']" fragment="introduction" class="hover:text-emerald-400 transition-colors whitespace-nowrap">
        Introduction
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="about" class="hover:text-emerald-400 transition-colors whitespace-nowrap">
        About
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="timeline" class="hover:text-emerald-400 transition-colors whitespace-nowrap">
        Timeline
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="list-project" class="hover:text-emerald-400 transition-colors whitespace-nowrap">
        List Projects
      </a>
      <span class="text-gray-500">|</span>
      <a [routerLink]="['/']" fragment="gallery" class="hover:text-emerald-400 transition-colors whitespace-nowrap">
        Gallery
      </a>
    </div>

  </div>
</section>
