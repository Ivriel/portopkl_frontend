<!-- gallery.component.html -->
<div class="min-h-screen py-16 px-4 sm:px-6 lg:px-8" id="gallery">
  
  <!-- Header Section -->
  <div class="max-w-7xl mx-auto mb-12">
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-[#34D399]/20 rounded-full mb-4">
        <i class="pi pi-images text-[#34D399]"></i>
        <span class="text-sm text-gray-400">3PM Solution</span>
      </div>
      <h1 class="text-4xl md:text-6xl font-bold text-white mb-4">
        Gallery <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#34D399] to-[#059669]">Section</span>
      </h1>
      <p class="text-gray-400 text-lg max-w-2xl mx-auto">
        Kumpulan dokumentasi tempat PKL
      </p>
    </div>
  </div>

  <!-- Bento Grid Gallery -->
  <div class="max-w-7xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 auto-rows-[350px]">
      
      <div 
        *ngFor="let item of galleryItems" 
        [ngClass]="{
          'md:col-span-2 md:row-span-2': item.size === 'large',
          'md:col-span-1 md:row-span-2': item.size === 'medium',
          'md:col-span-1 md:row-span-1': item.size === 'small'
        }"
        class="gallery-item group relative overflow-hidden rounded-2xl cursor-pointer">
        
        <!-- Image -->
        <img 
          [src]="item.image" 
          [alt]="item.title"
          class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
        />
        
        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent opacity-60 group-hover:opacity-90 transition-opacity duration-300"></div>

        <!-- Caption (Always Visible) -->
        <div class="absolute bottom-0 left-0 right-0 p-6 transform translate-y-0 transition-transform duration-300">
          <h3 class="text-xl md:text-2xl font-bold text-white mb-2 flex items-center gap-2">
            <i class="pi pi-image text-[#34D399] text-sm"></i>
            {{item.title}}
          </h3>
        </div>

        <!-- Description (Hover Only) -->
        <div class="absolute inset-0 flex items-center justify-center p-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          <div class="text-center">
            <p class="text-gray-200 text-sm md:text-base leading-relaxed px-4">
              {{item.description}}
            </p>
          </div>
        </div>

      </div>

    </div>

    

</div>
