<!-- gallery.component.html -->
<div id="gallery" class="min-h-screen py-16 px-4 sm:px-6 lg:px-8">
  
  <!-- Header Section -->
  <div class="max-w-7xl mx-auto mb-12">
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-[#34D399]/20 rounded-full mb-4">
        <i class="pi pi-sparkles text-[#34D399]"></i>
        <span class="text-sm text-gray-400">3PM Solution</span>
      </div>
      <h1 class="text-4xl md:text-6xl font-bold text-white mb-4">
        Gallery <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#34D399] to-[#059669]">Sections</span>
      </h1>
      <p class="text-gray-400 text-lg max-w-2xl mx-auto">
        Kumpulan dokumentasi tempat PKL dan projek PKL
      </p>
    </div>

    <!-- Filter Tabs -->
    <div class="flex flex-wrap items-center justify-center gap-3 mb-8">
      <button 
        *ngFor="let cat of categories"
        (click)="filterByCategory(cat.value)"
        [class.filter-active]="selectedCategory === cat.value"
        class="px-6 py-2.5 bg-zinc-800/50 border border-zinc-700 rounded-xl text-gray-400 font-medium text-sm transition-all duration-300 hover:bg-[#34D399]/10 hover:border-[#34D399]/30 hover:text-[#34D399]">
        {{cat.label}}
      </button>
    </div>
  </div>

  <!-- Bento Grid Gallery -->
 

</div>
